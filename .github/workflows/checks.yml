name: BEKAL checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/check_repository_safety.py --history

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install -e '.[dev]'
        working-directory: backend
      - run: python -m pip install 'pip-audit>=2.7,<3'
      - run: python -m pip_audit --skip-editable
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Select stable Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version
          cargo --version
      - name: Rust format and compile
        shell: pwsh
        run: |
          cargo fmt --manifest-path frontend/src-tauri/Cargo.toml --check
          cargo check --locked --manifest-path frontend/src-tauri/Cargo.toml
      - name: Rust dependency audit
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          Push-Location frontend/src-tauri
          try {
            cargo audit
          }
          finally {
            Pop-Location
          }
      - name: Build BEKAL NSIS installer
        run: npm run tauri build -- --bundles nsis
        working-directory: frontend
      - name: Verify installer output
        shell: pwsh
        run: |
          $Installers = @(Get-ChildItem 'frontend/src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($Installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($Installers.Count)."
          }
          Write-Host "Installer: $($Installers[0].FullName)"
          Write-Host "SHA256: $((Get-FileHash $Installers[0].FullName -Algorithm SHA256).Hash)"
      - uses: actions/upload-artifact@v6
        with:
          name: BEKAL-Windows-Installer
          path: frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
