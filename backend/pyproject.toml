[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bekal-backend"
version = "0.1.0"
description = "Local-first BEKAL API foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "pypdfium2>=4.30,<5",
  "pytesseract>=0.3.13,<1",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.28,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
